[workspace]
members = ["crates/vault-core", "crates/vault-api", "crates/vault-storage", "crates/vault-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
uniffi = "=0.32.2"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
aes = "0.8"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
subtle = "2.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
