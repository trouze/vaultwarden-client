name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: bash scripts/test-swift.sh
      - run: bash scripts/build-app.sh
      - name: Compile standalone Xcode app without a developer account
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          bash scripts/generate-project.sh
          xcodebuild -project apps/macos/VaultwardenClient.xcodeproj \
            -scheme VaultwardenClient -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apps/macos/VaultwardenClient.xcodeproj \
            -scheme CredentialProviderPrototype -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/xcode CODE_SIGNING_ALLOWED=NO build
