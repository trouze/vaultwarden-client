name: VaultwardenClient
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
  Development: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Public provisional identifiers; the standalone app needs no paid team.
    BUNDLE_ID_PREFIX: org.vaultwardenclient
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: arm64
    SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../../build/generated"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/../../build/generated/VaultCoreFFI.modulemap"
    OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../../target/debug/libvault_ffi.a"
targets:
  VaultwardenClient:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements, Development.entitlements]
      - Shared
      - ../../build/generated/VaultCore.swift
    configFiles:
      Development: Config/Development.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).desktop"
        PRODUCT_NAME: Vaultwarden
        PRODUCT_MODULE_NAME: VaultwardenClient
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
      configs:
        Development:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: App/Development.entitlements
    preBuildScripts:
      - name: Build Rust core and generate Swift bindings
        script: 'bash "$SRCROOT/../../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
  CredentialProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: CredentialProvider
        excludes: [Info.plist, CredentialProvider.entitlements]
      - Shared
      - ../../build/generated/VaultCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).desktop.credentials"
        PRODUCT_MODULE_NAME: CredentialProvider
        INFOPLIST_FILE: CredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: CredentialProvider/CredentialProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
    preBuildScripts:
      - name: Build Rust core and generate Swift bindings
        script: 'bash "$SRCROOT/../../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
schemes:
  VaultwardenClient:
    build:
      targets:
        VaultwardenClient: all
  CredentialProviderPrototype:
    build:
      targets:
        CredentialProvider: all
  VaultwardenDevelopment:
    build:
      targets:
        VaultwardenClient: all
    run:
      config: Development
    profile:
      config: Development
    analyze:
      config: Development
    archive:
      config: Development
